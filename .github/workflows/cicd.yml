name: CI/CD Pipeline

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]
  workflow_dispatch:
    inputs:
      action:
        description: "O que executar"
        required: true
        type: choice
        options: [apply, destroy]
        default: apply
      confirm:
        description: 'Para destroy, digite "destroy" para confirmar'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/officyna/officyna-execution-production
  JAVA_VERSION: "21"

jobs:
  build-test:
    name: Build e testes
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compilar e executar testes
        run: mvn --batch-mode --update-snapshots verify

      - name: Análise SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          mvn --batch-mode sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=officyna \
            -Dsonar.projectKey=officyna-execution-production

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  docker:
    name: Build e push da imagem
    needs: build-test
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tags e metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-app:
    name: Deploy da aplicação no Kubernetes
    needs: docker
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: production
    env:
      K8S_NAMESPACE: officyna
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: eks-officyna-service
      PRODUCTION_EXECUTION_ROLE_ARN: ${{ vars.PRODUCTION_EXECUTION_ROLE_ARN }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar configuração do ambiente
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          for variable_name in \
            AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY EKS_CLUSTER_NAME \
            K8S_NAMESPACE PRODUCTION_EXECUTION_ROLE_ARN DB_PASSWORD \
            JWT_SECRET GHCR_USERNAME GHCR_PAT; do
            if [ -z "${!variable_name}" ]; then
              echo "Configuração obrigatória ausente: $variable_name" >&2
              exit 1
            fi
          done

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ler endpoint do DocumentDB
        id: docdb
        run: |
          ENDPOINT=$(aws ssm get-parameter --name "/officyna/db/endpoint" --query "Parameter.Value" --output text)
          echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Conectar ao cluster existente
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          kubectl wait --for=condition=Ready nodes --all --timeout=600s
          kubectl get nodes

      - name: Validar addon de métricas requerido pelo HPA
        run: kubectl get deployment metrics-server --namespace=kube-system

      - name: Instalar envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Garantir namespace da aplicação
        run: kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar ServiceAccount da aplicação
        run: envsubst '${K8S_NAMESPACE} ${PRODUCTION_EXECUTION_ROLE_ARN}' < k8s/service-account.yaml | kubectl apply -f -

      - name: Aplicar ConfigMap
        run: |
          envsubst '${K8S_NAMESPACE} ${AWS_REGION}' \
            < k8s/configmap.yaml | kubectl apply -f -

      - name: Criar ou atualizar Secret da aplicação
        env:
          DOCDB_ENDPOINT: ${{ steps.docdb.outputs.endpoint }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          MONGODB_URI="$(python3 -c 'import os, urllib.parse; print("mongodb://officynasoatdbuser:{}@{}:27017/?tls=true&replicaSet=rs0&authSource=admin&readPreference=primary&retryWrites=false".format(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""), os.environ["DOCDB_ENDPOINT"]))')"
          umask 077
          SECRET_ENV_FILE="$(mktemp)"
          trap 'rm -f "$SECRET_ENV_FILE"' EXIT
          printf 'MONGODB_URI=%s\nJWT_SECRET=%s\n' "$MONGODB_URI" "$JWT_SECRET" > "$SECRET_ENV_FILE"
          kubectl create secret generic production-execution-secret \
            --from-env-file="$SECRET_ENV_FILE" \
            --namespace="$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Criar ou atualizar credencial de pull do GHCR
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io --docker-username="$GHCR_USERNAME" --docker-password="$GHCR_PAT" \
            --namespace="$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar Deployment, Service e HPA
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
        run: |
          envsubst '${K8S_NAMESPACE}' < k8s/deployment.yaml | kubectl apply -f -
          kubectl set image deployment/production-execution-service \
            production-execution-service="${IMAGE_NAME}:${IMAGE_TAG}" --namespace="$K8S_NAMESPACE"
          envsubst '${K8S_NAMESPACE}' < k8s/service.yaml | kubectl apply -f -
          envsubst '${K8S_NAMESPACE}' < k8s/hpa.yaml | kubectl apply -f -

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/production-execution-service --namespace="$K8S_NAMESPACE" --timeout=300s
          kubectl get pods,svc,hpa --namespace="$K8S_NAMESPACE"

      - name: Logs da aplicação
        if: success()
        run: kubectl logs deployment/production-execution-service --namespace="$K8S_NAMESPACE" --tail=200

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl get pods --namespace="$K8S_NAMESPACE" -o wide || true
          kubectl describe pod --namespace="$K8S_NAMESPACE" -l app.kubernetes.io/name=production-execution || true
          kubectl get events --namespace="$K8S_NAMESPACE" --sort-by=.metadata.creationTimestamp || true
          POD=$(kubectl get pods --namespace="$K8S_NAMESPACE" -l app.kubernetes.io/name=production-execution -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD" ]; then
            kubectl logs "$POD" --namespace="$K8S_NAMESPACE" --all-containers=true || true
            kubectl logs "$POD" --namespace="$K8S_NAMESPACE" --all-containers=true --previous || true
          fi

  destroy-app:
    name: Remover recursos da aplicação do cluster
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' && github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    env:
      K8S_NAMESPACE: officyna
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: eks-officyna-service
    permissions:
      contents: read
    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Conectar ao cluster existente
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Remover somente recursos da aplicação
        run: |
          kubectl delete hpa,service,deployment \
            --selector=app.kubernetes.io/name=production-execution \
            --namespace="$K8S_NAMESPACE" --ignore-not-found=true
          kubectl delete serviceaccount production-execution-service \
            --namespace="$K8S_NAMESPACE" --ignore-not-found=true
          kubectl delete configmap production-execution-configmap \
            --namespace="$K8S_NAMESPACE" --ignore-not-found=true
          kubectl delete secret production-execution-secret ghcr-secret \
            --namespace="$K8S_NAMESPACE" --ignore-not-found=true
          kubectl get all --namespace="$K8S_NAMESPACE"
