spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/?replicaSet=rs0}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
server:
  port: ${SERVER_PORT:8084}
os-service:
  base-url: ${OS_SERVICE_BASE_URL:http://localhost:8081}
database:
  supply-name: ${SUPPLY_DATABASE:officyna_supply}
  labor-name: ${LABOR_DATABASE:officyna_labor}
  snapshot-name: ${SNAPSHOT_DATABASE:officyna_snapshot}
  seed:
    enabled: false
jwt:
  secret: ${JWT_SECRET:officyna-secret-key-change-in-production-min-256bits}
  expiration: ${JWT_EXPIRATION:86400000}
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
logging:
  level:
    br.com.officyna_execution_production: INFO
    org.springframework.security: INFO
aws:
  sqs:
    event-for-diagnostics: ${EVENT_FOR_DIAGNOSTICS_QUEUE:eventForDiagnostics}
    event-for-diagnostics-dlq: ${EVENT_FOR_DIAGNOSTICS_DLQ:eventForDiagnosticsDlq}
    event-diagnosis: ${EVENT_DIAGNOSIS_QUEUE:eventDiagnosis}
    event-diagnosis-dlq: ${EVENT_DIAGNOSIS_DLQ_QUEUE:eventDiagnosisDlq}
    event-diagnosis-completed: ${EVENT_DIAGNOSIS_COMPLETED_QUEUE:eventDiagnosisCompleted}
    event-diagnosis-completed-dlq: ${EVENT_DIAGNOSIS_COMPLETED_DLQ_QUEUE:eventDiagnosisCompletedDlq}
    event-execution-started: ${EVENT_EXECUTION_STARTED_QUEUE:eventExecutionStarted}
    event-for-os-completed: ${EVENT_FOR_OS_COMPLETED_QUEUE:eventForOsCompleted}
    event-service-order-recused: ${EVENT_SERVICE_ORDER_RECUSED_QUEUE:eventServiceOrderRecused}
    approval-queue: ${APPROVAL_QUEUE:productionApproval}
