services:
  sqs-admin:
    image: pacovk/sqs-admin:latest
    container_name: officyna-production-service-sqs-admin
    environment:
      SQS_ENDPOINT_URL: http://localstack:4566
      SQS_AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "127.0.0.1:8088:3999"
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - officyna-network
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo-init:
    image: mongo:7
    depends_on:
      mongodb: {condition: service_healthy}
    entrypoint: ["mongosh", "--host", "mongodb:27017", "--eval", "try { rs.status(); } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}); }"]
    restart: "no"
  mongo-express:
    image: mongo-express:1
    profiles: ["tools"]
    ports: ["127.0.0.1:8081:8081"]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
    depends_on:
      mongo-init: {condition: service_completed_successfully}
  app:
    build: .
    ports: ["8084:8084"]
    depends_on:
      mongo-init: {condition: service_completed_successfully}
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0
      OS_SERVICE_BASE_URL: ${OS_SERVICE_BASE_URL:-http://host.docker.internal:8081}
      JWT_SECRET: ${JWT_SECRET:-officyna-secret-key-change-in-production-min-256bits}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      EVENT_FOR_DIAGNOSTICS_QUEUE: ${EVENT_FOR_DIAGNOSTICS_QUEUE:-eventForDiagnostics}
      EVENT_DIAGNOSIS_QUEUE: ${EVENT_DIAGNOSIS_QUEUE:-eventDiagnosis}
      EVENT_EXECUTION_STARTED_QUEUE: ${EVENT_EXECUTION_STARTED_QUEUE:-eventExecutionStarted}
      EVENT_FOR_OS_COMPLETED_QUEUE: ${EVENT_FOR_OS_COMPLETED_QUEUE:-eventForOsCompleted}
      APPROVAL_QUEUE: ${APPROVAL_QUEUE:-productionApproval}
      EVENT_DIAGNOSIS_COMPLETED_QUEUE: ${EVENT_DIAGNOSIS_COMPLETED_QUEUE:-eventDiagnosisCompleted}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: production-execution-service
    restart: unless-stopped
volumes:
  mongo_data:
