    <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">JaCoCo Code Coverage &amp; Test Summary</text>
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">officyna-execution-production | Tech Challenge Fase 4 — FIAP (Meta &gt;= 80%)</text>
  </g>

