apiVersion: v1
kind: Service
metadata:
  name: production-execution-service
  labels:
    app.kubernetes.io/name: production-execution
    app.kubernetes.io/component: api
  namespace: ${K8S_NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: production-execution
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
